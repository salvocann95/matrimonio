<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f9fc">
  <meta name="robots" content="noindex">
  <title>Salvatore &amp; Alessia | Il nostro matrimonio</title>

  <!-- Fallback senza JavaScript: apre il sito dopo 4.5 secondi (3s animazione + 1.5s pausa) -->
  <noscript><meta http-equiv="refresh" content="7;url=https://salvoealessia.it/"></noscript>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400&display=swap" rel="stylesheet">

  <style>
    :root {
      --deep: #78add4;   /* Azzurro polvere: la & e la barra */
      --ink: #263f59;    /* Blu notte: testi e nomi */
      --accent: #b9dcef; /* Azzurro chiaro */
      --bg: #f5f8fa;
      --sky: #edf6fb;    /* Colore finale del velo sulla foto */
      --frost: #f4f9fc;  /* Colore iniziale del velo sulla foto */
      --wait: 3s;        /* Durata delle animazioni testo e barra: deve coincidere con var ANIMATION_MS nello script */
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'DM Sans', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Stesso sfondo dell'hero del sito: foto con velo chiaro */
    .hero {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: env(safe-area-inset-top, 0px) 22px env(safe-area-inset-bottom, 0px);
      position: relative;
      isolation: isolate;
      background: linear-gradient(180deg, color-mix(in srgb, var(--frost) 91%, transparent), var(--sky)), url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1800&q=85') center/cover;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(255,255,255,.72);
      pointer-events: none;
      z-index: -1;
    }

    .hero-inner { max-width: 700px; animation: appear .9s ease both; }

    .kicker {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--ink);
    }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 400;
      font-size: clamp(48px, 8vw, 82px);
      line-height: 1.05;
      margin: 18px 0 10px;
      color: var(--ink);
      text-align: center;
    }

    h1 span {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
      position: relative;
    }

    h1 em {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      color: var(--deep);
      font-size: 0.80em;
      position: absolute;
      left: 100%;
      bottom: 0.40em;
      margin-left: 8px;
    }

    .ornament {
      color: var(--ink);
      letter-spacing: 8px;
      margin: 20px;
    }

    .bar {
      width: 160px;
      height: 2px;
      margin: 34px auto 0;
      background: color-mix(in srgb, var(--deep) 28%, transparent);
      overflow: hidden;
      border-radius: 2px;
    }

    .bar i {
      display: block;
      width: 100%;
      height: 100%;
      background: var(--deep);
      transform: scaleX(0);
      transform-origin: left;
      animation: fill var(--wait) linear forwards;
    }

    .hero p {
      font: 16px/1.7 'Playfair Display', Georgia, serif;
      color: var(--deep);
      margin: 18px auto 0;
      width: fit-content;
      clip-path: inset(0 100% 0 0);
      animation: reveal var(--wait) linear forwards;
    }
	
    @keyframes reveal { to { clip-path: inset(0 0 0 0); } }
    @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fill   { to { transform: scaleX(1); } }

    @media (max-width: 720px) {
      .ornament { letter-spacing: 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-inner { animation: none; }
      .bar i { animation: none; transform: scaleX(1); }
      .hero p { animation: none; clip-path: none; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="kicker">Il nostro matrimonio</div>
      <h1>Salvatore<br><span>Alessia <em>&amp;</em></span></h1>
      <div class="ornament">05 ✦ 06 ✦ 2027</div>
      <div class="bar" aria-hidden="true"><i id="fill"></i></div>
      <p>Un nuovo capitolo sta per iniziare…</p>
    </div>
  </header>

  <script>
    var TARGET = "https://salvoealessia.it/";
    var ANIMATION_MS = 3000; // 3 secondi di caricamento (barra + testo)
    var PAUSE_MS = 1500;     // 1.5 secondi di pausa a completamento avvenuto
    var TOTAL_WAIT = ANIMATION_MS + PAUSE_MS; // Totale: 4500ms (4.5 secondi)

    var dest = TARGET + window.location.search + window.location.hash;
    var done = false;

    function go() {
      if (done) return;
      done = true;
      window.location.replace(dest);
    }

    // Apre il sito esattamente dopo 4.5 secondi (3s animazione + 1.5s pausa)
    setTimeout(go, TOTAL_WAIT);
  </script>
</body>
</html>
