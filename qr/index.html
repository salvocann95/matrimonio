<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="3;url=https://www.salvoealessia.it/index_completo.html">
  <title>Salvatore & Alessia | Il nostro matrimonio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fbf8f1;
      color: #536f7b;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }

    .card {
      padding: 50px 25px;
      max-width: 500px;
      width: 90%;
    }

    .welcome {
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 4px;
      color: #8da9b4;
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(32px, 8vw, 48px);
      font-weight: normal;
      line-height: 1.25;
      margin: 0;
    }

    .ampersand {
      color: #c5a76b;
      font-style: italic;
    }

    .line {
      width: 48px;
      height: 1px;
      background: #c5a76b;
      margin: 25px auto;
    }

    .subtitle {
      font-size: 17px;
      letter-spacing: 1px;
      color: #687d82;
    }

    .heart {
      color: #c5a76b;
      font-size: 25px;
      margin: 25px 0;
    }

    .message {
      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1.8;
      color: #77756f;
      margin: 0 auto 30px;
      max-width: 340px;
    }

    .button {
      display: inline-block;
      background: #7f9eaa;
      color: white;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 30px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 1px;
      transition: background 0.2s;
    }

    .button:hover {
      background: #637f8b;
    }

    .loading {
      margin-top: 25px;
      font-family: Arial, sans-serif;
      font-size: 11px;
      color: #a9a195;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="welcome">BENVENUTI</div>

    <h1>
      Salvatore<br><span>Alessia <em>&amp;</em></span>
    </h1>

    <div class="line"></div>

    <div class="subtitle">Il nostro matrimonio</div>

    <div class="heart">♡</div>

    <p class="message">
      Siamo felici di condividere con voi
      questo giorno speciale.
    </p>

    <a class="button" href="https://www.salvoealessia.it/">
      ENTRA NEL SITO
    </a>

    <div class="loading">
      Ti stiamo reindirizzando…
    </div>
  </main>
</body>
</html>
