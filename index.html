<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f9fc">
  <title>Salvatore &amp; Alessia | Il nostro matrimonio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --deep: #78add4;      /* Azzurro polvere: la &, il cuore */
      --ink: #263f59;       /* Blu notte: nomi e testo */
      --nav-link: #526b80;  /* Grigio-blu: etichette piccole (più leggibile dell'azzurro su fondo chiaro) */
      --frost: #f4f9fc;     /* Velo sulla foto, in alto */
      --sky: #edf6fb;       /* Velo sulla foto, in basso */
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 60px 22px;
      text-align: center;
      color: var(--ink);
      font-family: 'DM Sans', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      position: relative;
      isolation: isolate;
      background-color: var(--sky);
      /* Stessa foto e stesso velo dell'hero del sito */
      background-image:
        linear-gradient(180deg, color-mix(in srgb, var(--frost) 91%, transparent), var(--sky)),
        url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1800&q=85');
      background-size: cover;
      background-position: center;
    }

    /* Cornice sottile come nell'hero del sito */
    body::before {
      content: "";
      position: fixed;
      inset: 18px;
      border: 1px solid rgba(255, 255, 255, .72);
      pointer-events: none;
      z-index: -1;
    }

    .content {
      width: 100%;
      max-width: 640px;
      animation: appear 1.1s ease both;
    }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 400;
      font-size: clamp(48px, 11vw, 82px);
      line-height: 1.05;
      margin: 0;
      color: var(--ink);
    }

    h1 span {
      display: inline-block;
      position: relative;
    }

    h1 em {
      position: absolute;
      left: 100%;
      bottom: .4em;
      margin-left: 8px;
      font-style: italic;
      font-size: .8em;
      color: var(--deep);
    }

    .date {
      margin: 22px 0 0;
      letter-spacing: 8px;
      padding-left: 8px;
      font-size: 14px;
    }

    .message {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(17px, 3.6vw, 20px);
      line-height: 1.7;
      color: var(--ink);
      max-width: 460px;
      margin: 30px auto 0;
    }

    .name {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      letter-spacing: .6px;
      color: var(--nav-link);
    }

    .logo {
      display: block;
      width: 50px;
      height: auto;
      margin: 44px auto 0;
    }

    @keyframes appear {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .content { animation: none; }
    }

    @media (max-width: 480px) {
      body::before { inset: 10px; }
      .date { letter-spacing: 5px; font-size: 13px; }
      .name { font-size: 11px; }
      .logo { width: 42px; }
    }
  </style>
</head>

<body>

  <main class="content">
    <h1>Salvatore<br><span>Alessia <em>&amp;</em></span></h1>
    <div class="date">05 ✦ 06 ✦ 2027</div>

    <p class="message">
      Il sito è momentaneamente offline:<br>
      stiamo preparando qualcosa di speciale.<br>
      Torna a trovarci presto!<br><br>
    </p>

  </main>
  
</body>
</html>
